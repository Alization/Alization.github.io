<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我還不知道要幹嘛</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: linear-gradient(135deg, #fdf2f8 0%, #eff6ff 100%);
      color: #0f172a;
      overflow: hidden;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p {
      font-size: 15px;
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    /* ===== 灑花按鈕 ===== */
    .party-btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #d1fae5;
      border: 4px solid #6ee7b7;
      font-size: 44px;
      cursor: pointer;
      transition: transform 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .party-btn:hover  { transform: scale(1.12) rotate(-8deg); }
    .party-btn:active { transform: scale(0.92); }

    .hint {
      margin-top: 14px;
      margin-bottom: 0;
      font-size: 13px;
      color: #94a3b8;
    }

    /* ===== 掉落的愛心 ===== */
    .confetti-piece {
      position: fixed;
      top: -40px;
      pointer-events: none;
      z-index: 200;
      animation: confettiFall linear forwards;
      user-select: none;
    }

    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg) scale(0.6); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>我還不知道要幹嘛</h1>
    <p>但先來灑個愛心再說 🤷</p>
    <button class="party-btn" onclick="launchConfetti()" aria-label="灑花">🎉</button>
    <p class="hint">點我</p>
  </div>

  <script>
    function launchConfetti() {
      const emojis = ['❤️','🧡','💛','💚','💙','💜','🩷','🩵','💖','💗','💓','💝'];
      const count  = 36;

      for (let i = 0; i < count; i++) {
        const el = document.createElement('span');
        el.className = 'confetti-piece';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = (16 + Math.random() * 18) + 'px';
        el.style.animationDuration = (2.2 + Math.random() * 2) + 's';
        el.style.animationDelay    = (Math.random() * 1.2) + 's';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }
  </script>

</body>
</html>
